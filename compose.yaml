name: content-os

services:
  postgres:
    image: postgres:16-alpine
    container_name: content-os-postgres
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: contentos
      POSTGRES_DB: contentos
    ports:
      - "5432:5432"
    volumes:
      - contentos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos -d contentos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contentos-data:
